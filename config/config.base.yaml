environment: "base"

api:
  base_url: "https://hatch-api.meta.ai"
  timeout: 30.0
  version: "1.0.0"
  user_agent: "com.facebook.aura/11.0.0.18.164 (Android 14; Mobile; en_US)"
  headers:
    Accept: "application/json"
    Content-Type: "application/json"
    X-API-Version: "1.0.0"

auth:
  default_region: "US"
  default_key_id: 41
  auto_resume_session: true

storage:
  session_cache_path: "data/sessions/session_cache.json"
  credentials_path: "data/sessions/credentials.json"

logging:
  level: "INFO"
  format: "[%(asctime)s] [%(levelname)s] [%(name)s]: %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"

mcp:
  enabled: false
  host: "127.0.0.1"
  port: 8765

privacy:
  ohttp_enabled: false
  ohttp_relay_url: "https://meta-ohttp-relay-prod.fastly-edge.com"
